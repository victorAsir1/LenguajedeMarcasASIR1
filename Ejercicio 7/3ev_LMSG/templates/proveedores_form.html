{% extends "base.html" %}

{% block content %}
<div class="form-section">
    <h2>{% if mode == 'new' %}Añadir Proveedor{% else %}Editar Proveedor #{{ proveedor.id }}{% endif %}</h2>

    <form method="POST" class="crud-form">
        <div class="form-group">
            <label for="nombre">Nombre de la Empresa *</label>
            <input type="text" id="nombre" name="nombre" value="{{ proveedor.nombre if proveedor else '' }}" required>
        </div>

        <div class="form-group">
            <label for="contacto">Persona de Contacto</label>
            <input type="text" id="contacto" name="contacto" value="{{ proveedor.contacto if proveedor else '' }}">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" value="{{ proveedor.telefono if proveedor else '' }}">
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" value="{{ proveedor.email if proveedor else '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                {% if mode == 'new' %}Crear Proveedor{% else %}Guardar Cambios{% endif %}
            </button>
            <a href="{{ url_for('proveedores_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
